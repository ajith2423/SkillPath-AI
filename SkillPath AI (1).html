<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillPath AI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#14162b;--mut:#5d6280;--line:#e3e5f0;--blue:#2563eb;--vio:#7c3aed;--soft:#eef0ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--panel:#171a30;--ink:#eceefb;--mut:#a0a5c8;--line:#2a2e4d;--soft:#22264a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--panel:#171a30;--ink:#eceefb;--mut:#a0a5c8;--line:#2a2e4d;--soft:#22264a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;padding:4px 10px 16px;background:linear-gradient(90deg,var(--blue),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--mut);font-weight:500}
nav button:hover{background:var(--soft)}nav button.on{background:var(--soft);color:var(--vio);font-weight:600}
nav .sp{flex:1}
main{padding:26px clamp(16px,3vw,40px);max-width:1100px;width:100%}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0}
.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em}
.btn{all:unset;cursor:pointer;background:linear-gradient(90deg,var(--blue),var(--vio));color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--soft);color:var(--vio)}.btn.sm{padding:5px 11px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--vio);margin:2px 4px 2px 0}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--vio));transition:width .5s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.mod{border-top:1px solid var(--line);padding:12px 0}.mod:first-child{border:0}
.mod.d h3{text-decoration:line-through;color:var(--mut)}
a{color:var(--blue)}small,.mut{color:var(--mut);font-size:13px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto;padding:4px}
.b{padding:9px 13px;border-radius:14px;max-width:85%}.b.u{align-self:flex-end;background:linear-gradient(90deg,var(--blue),var(--vio));color:#fff;border-bottom-right-radius:4px}
.b.a{background:var(--soft);border-bottom-left-radius:4px}
input[type=text],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.q{margin-bottom:16px}.q label{display:block;padding:6px 0}
.trace span{font-size:12px}.trace span:not(:last-child)::after{content:" › ";color:var(--mut)}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars b{display:block;background:linear-gradient(var(--vio),var(--blue));border-radius:5px 5px 0 0;min-height:3px}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:5;padding-top:calc(10px + env(safe-area-inset-top,0px))}.brand{display:none}nav button{white-space:nowrap}nav .sp{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div>
<script>
const LV=["none","beginner","intermediate","advanced"],$=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
const R={"Full Stack Developer":"HTML:2:1:1,CSS:2:1:1,JavaScript:2:2:2,React:2:2:3,Node.js:2:2:4,Express.js:2:1:4,SQL:2:1.5:5,REST APIs:2:1.5:5,Git:1:1:5",
"Frontend Developer":"HTML:3:1:1,CSS:3:1.5:1,JavaScript:3:2:2,React:2:2:3,Git:2:1:4","Backend Developer":"Python:3:2:1,SQL:3:2:2,REST APIs:2:2:3,Docker:2:1:4,Git:2:1:4",
"Data Scientist":"Python:3:2:1,Statistics:2:2:2,Pandas:2:1.5:3,SQL:2:1:3,Data Visualization:2:1:4,Machine Learning:2:2:5","Data Analyst":"SQL:3:2:1,Excel:2:1:1,Statistics:2:1.5:2,Data Visualization:2:1.5:3,Python:2:1:4",
"AI/ML Engineer":"Python:3:2:1,Statistics:2:1:2,Pandas:2:1:2,Machine Learning:3:2:3,Deep Learning:2:2:4","Cybersecurity Analyst":"Networking:2:2:1,Linux:2:1.5:1,Security Fundamentals:3:2:2,Cryptography:2:1:3,Python:2:1:4",
"Cloud Engineer":"Linux:2:1.5:1,Networking:2:1:1,Cloud Fundamentals:3:2:2,Docker:2:1.5:3,Python:2:1:4","DevOps Engineer":"Linux:2:1.5:1,Git:2:1:1,Docker:3:2:2,CI/CD:2:2:3,Cloud Fundamentals:2:1.5:4",
"UI/UX Designer":"Figma:3:2:1,UX Research:2:2:2,HTML:2:1:3,CSS:2:1:3,Communication:2:1:4"};
const RES={HTML:["MDN: HTML","https://developer.mozilla.org/en-US/docs/Web/HTML"],CSS:["MDN: CSS","https://developer.mozilla.org/en-US/docs/Web/CSS"],JavaScript:["javascript.info","https://javascript.info/"],React:["React: Learn","https://react.dev/learn"],"Node.js":["Node.js: Learn","https://nodejs.org/en/learn/getting-started/introduction-to-nodejs"],"Express.js":["Express: Getting started","https://expressjs.com/en/starter/installing.html"],"REST APIs":["RESTful API tutorial","https://restfulapi.net/"],SQL:["SQLBolt","https://sqlbolt.com/"],Python:["Python tutorial","https://docs.python.org/3/tutorial/"],Git:["Pro Git book","https://git-scm.com/book/en/v2"],Statistics:["Khan Academy: Statistics","https://www.khanacademy.org/math/statistics-probability"],Pandas:["Kaggle: Pandas","https://www.kaggle.com/learn/pandas"],"Machine Learning":["Kaggle: Intro to ML","https://www.kaggle.com/learn/intro-to-machine-learning"],"Data Visualization":["Kaggle: Data Visualization","https://www.kaggle.com/learn/data-visualization"],"Deep Learning":["Kaggle: Deep Learning","https://www.kaggle.com/learn/intro-to-deep-learning"],Linux:["Linux Journey","https://linuxjourney.com/"],Networking:["Cloudflare Learning Center","https://www.cloudflare.com/learning/"],"Security Fundamentals":["OWASP Top Ten","https://owasp.org/www-project-top-ten/"],"Cloud Fundamentals":["AWS Cloud Essentials","https://aws.amazon.com/getting-started/cloud-essentials/"],Docker:["Docker: Get started","https://docs.docker.com/get-started/"],"CI/CD":["GitHub Actions docs","https://docs.github.com/en/actions"],Excel:["Excel help","https://support.microsoft.com/en-us/excel"],"UX Research":["NN/g UX research","https://www.nngroup.com/articles/ux-research-cheat-sheet/"],Figma:["Figma Help Center","https://help.figma.com/hc/en-us"]};
const EX={HTML:"Build a semantic profile page with a form.",CSS:"Recreate a pricing card with Flexbox and Grid.",JavaScript:"Write a to-do app that handles click events.",React:"Build a filterable list with useState.","Node.js":"Serve a file over HTTP with Node.","Express.js":"Create an Express server with two routes.","REST APIs":"Design CRUD endpoints for a notes API.",SQL:"Write JOIN and GROUP BY queries on a students table.",Python:"Write a CLI that summarizes a CSV file."};
const Q={HTML:[["Which tag is the top-level heading?",["<h6>","<h1>","<head>","<header>"],1,"<h1> is the top-level heading."],["Which attribute gives an image alternative text?",["title","src","alt","href"],2,"alt is read by screen readers."],["Which element marks navigation links?",["<div>","<nav>","<span>","<b>"],1,"<nav> is the semantic choice."]],
CSS:[["Which property sets text color?",["font-color","color","text-style","fg"],1,"color sets text color."],["Which value turns on Flexbox?",["block","inline","flex","stack"],2,"display:flex creates a flex container."],["Which selector targets id hero?",[".hero","#hero","hero","*hero"],1,"# selects ids, . selects classes."]],
JavaScript:[["Which keyword declares a block-scoped variable?",["var","let","def","dim"],1,"let and const are block-scoped."],["What does === compare?",["Value only","Type only","Value and type","Reference only"],2,"Strict equality checks value and type."],["Which method adds to the end of an array?",["push","pop","shift","slice"],0,"push appends to the end."]],
React:[["Which hook holds local state?",["useRef","useState","useMemo","useId"],1,"useState stores state in a component."],["How does a parent pass data to a child?",["props","cookies","imports","globals"],0,"Parents pass props."],["What is JSX?",["A database","A JavaScript syntax extension","A CSS tool","A server"],1,"JSX lets you write markup in JavaScript."]],
"Node.js":[["Node.js runs JavaScript on the…",["Browser only","Server","GPU","Database"],1,"Node is a server-side runtime."],["Which command installs a package?",["npm install","node get","npm fetch","pkg add"],0,"npm install adds dependencies."],["Which core module reads files?",["http","fs","os","url"],1,"fs is the file system module."]],
SQL:[["Which clause filters rows?",["ORDER BY","WHERE","GROUP BY","LIMIT"],1,"WHERE filters rows."],["Which JOIN keeps only matching rows?",["LEFT JOIN","INNER JOIN","FULL JOIN","CROSS JOIN"],1,"INNER JOIN keeps matches only."],["Which function counts rows?",["SUM","COUNT","AVG","MAX"],1,"COUNT counts rows."]],
Python:[["Which is a list literal?",["(1,2)","{1,2}","[1,2]","<1,2>"],2,"Square brackets make a list."],["What does len('abc') return?",["2","3","4","Error"],1,"The string has 3 characters."],["Which keyword defines a function?",["func","def","function","fn"],1,"def defines a function."]]};
let S;try{S=JSON.parse(localStorage.getItem("skillpath"))}catch(e){}
const fresh=()=>({role:"Full Stack Developer",sk:{Python:{l:2,v:0},SQL:{l:2,v:0},HTML:{l:1,v:0}},done:{},att:[],rem:[],ev:[],chat:[],tab:"dash",quiz:null,res:null,msg:"Welcome, Arun! Your roadmap for Full Stack Developer is ready.",tr:["Coordinator","Skill Analyzer","Career Matcher","Learning Planner","Mentor"]});
if(!S||!S.sk)S=fresh();
const save=()=>{try{localStorage.setItem("skillpath",JSON.stringify(S))}catch(e){}};
const req=r=>R[r].split(",").map(x=>{const[s,l,w,p]=x.split(":");return{s,r:+l,w:+w,p:+p}});
function gap(role=S.role){let n=0,d=0;const rows=req(role).map(q=>{const h=S.sk[q.s],l=h?h.l:0,v=h&&h.v,cov=Math.min(l/q.r,1),f=v?1:l?.8:0,pts=q.w*cov*f;n+=pts;d+=q.w;return{...q,l,v,cov,pts}});return{rows,sc:Math.round(1000*n/d)/10,miss:rows.filter(x=>!x.l),part:rows.filter(x=>x.l&&x.l<x.r)}}
function road(){const g=gap(),show=g.rows.filter(x=>x.l<x.r||S.done[x.s]),ph=[...new Set(show.map(x=>x.p))].sort((a,b)=>a-b),out=[];
S.rem.forEach(s=>out.push({t:"Phase 0: Review and reinforce",m:[{s,k:"rem",topic:"Review: "+s+" fundamentals",h:4,d:0}]}));
ph.forEach((p,i)=>{const it=show.filter(x=>x.p==p);out.push({t:"Phase "+(i+1)+": "+it.map(x=>x.s).join(", "),m:it.map(x=>({s:x.s,k:"core",topic:S.done[x.s]?x.s:x.s+" ("+LV[x.l]+" to "+LV[x.r]+")",h:Math.max(1,x.r-Math.min(x.l,x.r-1))*12,d:!!S.done[x.s]}))})});
const L=S.att.slice(-3);if(L.length>=3&&L.reduce((a,b)=>a+b.sc,0)/3>=85){const ad=g.rows.filter(x=>x.l>=x.r&&x.l<3).slice(0,3);if(ad.length)out.push({t:"Phase "+(ph.length+1)+": Advanced track",m:ad.map(x=>({s:x.s,k:"adv",topic:"Advanced "+x.s,h:10,d:!!S.done["adv:"+x.s],key:"adv:"+x.s}))})}
const ck="cap:"+S.role;out.push({t:"Final phase: Capstone",m:[{s:ck,k:"cap",topic:S.role+" capstone project",h:25,d:!!S.done[ck],ex:"Plan, build and document a portfolio project in a public repo."}]});return out}
const flat=()=>road().flatMap(p=>p.m),pct=()=>{const m=flat(),n=m.filter(x=>x.k!="rem");return n.length?Math.round(100*n.filter(x=>x.d).length/n.length):0};
const nextMod=()=>flat().find(x=>!x.d);
function streak(){let n=0,d=new Date();if(!S.ev.includes(today()))d.setDate(d.getDate()-1);while(S.ev.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function done(s,k){const key=k=="adv"?"adv:"+s:s;if(k=="rem")S.rem=S.rem.filter(x=>x!=s);else S.done[key]=1;if(k=="core"){const q=req(S.role).find(x=>x.s==s),h=S.sk[s]||(S.sk[s]={l:0,v:0});h.l=Math.max(h.l,q?q.r:1)}S.ev.push(today());save();render()}
function grade(s,ans){const q=Q[s],ok=q.map((x,i)=>ans[i]==x[2]),sc=Math.round(100*ok.filter(Boolean).length/q.length),h=S.sk[s]||(S.sk[s]={l:1,v:0});h.v=1;h.l=sc>=90?3:sc>=70?Math.max(h.l,2):sc<50?1:h.l;S.att.push({s,sc});S.ev.push(today());
const tr=["Coordinator","Progress Evaluator"],L=S.att.slice(-3),avg=L.reduce((a,b)=>a+b.sc,0)/L.length;let note="Score is on track. Keep going with your next module.";
if(sc<60){if(!S.rem.includes(s))S.rem.push(s);tr.push("Skill Analyzer","Career Matcher","Learning Planner");note="Low score. The Learning Planner added a review module at the start of your roadmap."}
else if(S.att.length>=3&&avg>=85){tr.push("Learning Planner");note="Consistently high scores. Advanced modules were added to your roadmap."}
tr.push("Mentor");S.tr=tr;S.res={s,sc,fb:q.map((x,i)=>({ok:ok[i],q:x[0],a:x[1][x[2]],w:x[3]})),note};save()}
function submit(){const s=S.quiz,ans=Q[s].map((_,i)=>{const e=document.querySelector("input[name=q"+i+"]:checked");return e?+e.value:-1});if(ans.includes(-1)){S.err="Answer every question before submitting.";return render()}S.err="";grade(s,ans);render()}
function goal(r){S.role=r;S.msg="Goal changed to "+r+". Readiness is "+gap().sc+"%. Your roadmap was rebuilt and completed modules for skills you still need were kept.";S.tr=["Coordinator","Skill Analyzer","Career Matcher","Learning Planner","Mentor"];S.tab="dash";save();render()}
function demo(){grade("JavaScript",Q.JavaScript.map(x=>(x[2]+1)%4));S.msg="Demo step 1 of 2: low JavaScript score. A review module was added. Open Roadmap to see it, then run the demo again to switch goal.";if(S.role!="Data Scientist"&&S.demoStep==1){goal("Data Scientist");S.demoStep=0;return}S.demoStep=1;S.tab="dash";save();render()}
function reply(t){t=t.toLowerCase();const g=gap(),n=nextMod(),a=S.att[S.att.length-1];
if(/today|next/.test(t))return n?"Next up: "+n.topic+" (about "+n.h+"h). "+(EX[n.s]||n.ex||""):"You finished every module. Take an assessment to verify your skills.";
if(/missing|gap/.test(t))return"For "+S.role+", readiness is "+g.sc+"%. Gaps: "+([...g.miss.map(x=>x.s),...g.part.map(x=>x.s+" (needs "+LV[x.r]+")")].join(", ")||"none")+".";
if(/score|low/.test(t))return a?"Your last score was "+a.sc+"% on "+a.s+". Review the matching module in your roadmap, then retake the quiz.":"You have no assessments yet. Take one from the Assessments tab.";
if(/exercise|practice/.test(t)){const k=Object.keys(EX).find(x=>t.includes(x.toLowerCase()))||(n&&EX[n.s]?n.s:"Python");return"Practice ("+k+"): "+EX[k]}
if(/project/.test(t))return"Build a small portfolio project for "+S.role+" using "+(n&&n.k=="core"?n.s:"your newest skill")+", and publish it on GitHub.";
if(/complete|progress|roadmap/.test(t))return"You have completed "+pct()+"% of your roadmap. Streak: "+streak()+" day(s).";
if(/become|how can|goal/.test(t))return"To become a "+S.role+": "+road().map(p=>p.t).join("; ")+".";
return"Ask me what to learn today, what you are missing, your progress, a practice exercise or a project idea."}
function send(t){t=(t||$("#ci").value).trim();if(!t)return;S.chat.push({r:"u",t},{r:"a",t:reply(t)});save();render();const c=$(".chat");if(c)c.scrollTop=1e9}
const ring=(v,s=120)=>{const r=s/2-10,c=2*Math.PI*r;return`<svg width="${s}" height="${s}" role="img" aria-label="${v}%"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="10"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--vio)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${s/2} ${s/2})"/><text x="50%" y="54%" text-anchor="middle" style="font-size:24px;font-weight:700;fill:var(--ink)">${v}%</text></svg>`};
function radar(){const rows=gap().rows.slice(0,8),n=rows.length,C=130,pt=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[C+Math.cos(a)*v*90,C+Math.sin(a)*v*90]},poly=f=>rows.map((x,i)=>pt(i,f(x)/3).join(",")).join(" ");
return`<svg viewBox="0 0 260 260" style="max-width:340px;width:100%">${[1,2,3].map(k=>`<polygon points="${rows.map((_,i)=>pt(i,k/3).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`).join("")}<polygon points="${poly(x=>x.r)}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="4 3"/><polygon points="${poly(x=>x.l)}" fill="var(--vio)" fill-opacity=".3" stroke="var(--vio)" stroke-width="2"/>${rows.map((x,i)=>{const[a,b]=pt(i,1.22);return`<text x="${a}" y="${b}" text-anchor="middle">${x.s.length>12?x.s.slice(0,11)+"…":x.s}</text>`}).join("")}</svg>`}
const trace=()=>`<div class="trace">${S.tr.map(x=>`<span>${x}</span>`).join("")}</div>`;
const mini=()=>{const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)}),c=days.map(d=>S.ev.filter(x=>x==d).length),m=Math.max(1,...c);return`<div class="bars">${c.map((v,i)=>`<div><b style="height:${v/m*70}px"></b>${days[i].slice(8)}</div>`).join("")}</div>`};
const V={
dash(){const g=gap(),n=flat().filter(x=>!x.d).slice(0,3);return`<h1>Hi, ${"Arun"}</h1><p class="sub">Goal: <b>${S.role}</b></p><div class="note"><b>Mentor:</b> ${S.msg}${trace()}</div>
<div class="grid"><div class="card row"><div>${ring(g.sc)}</div><div><h2>Career readiness</h2><small>Weighted by skill importance, level and verification. See the Skills tab for the formula.</small></div></div>
<div class="card"><h2>Roadmap progress</h2><div class="big">${pct()}%</div><div class="bar"><i style="width:${pct()}%"></i></div><small>Streak: ${streak()} day(s)</small></div>
<div class="card"><h2>Missing skills</h2>${g.miss.map(x=>`<span class="pill bad">${x.s}</span>`).join("")||"<small>None. Nice.</small>"}<h2 style="margin-top:12px">Below required level</h2>${g.part.map(x=>`<span class="pill warn">${x.s}</span>`).join("")||"<small>None.</small>"}</div></div>
<div class="grid" style="margin-top:14px"><div class="card"><h2>Up next</h2>${n.map(x=>`<div class="mod"><h3>${x.topic}</h3><small>${x.h}h</small>${RES[x.s]?` · <a href="${RES[x.s][1]}" target="_blank" rel="noopener">${RES[x.s][0]}</a>`:""}</div>`).join("")||"<small>All done.</small>"}<button class="btn sm" onclick="tab('road')">Open roadmap</button></div>
<div class="card"><h2>Weekly activity</h2>${mini()}</div>
<div class="card"><h2>Assessments</h2>${S.att.slice(-4).reverse().map(a=>`<div class="row sb"><span>${a.s}</span><span class="pill ${a.sc>=70?"ok":a.sc<60?"bad":"warn"}">${a.sc}%</span></div>`).join("")||"<small>No attempts yet.</small>"}<br><button class="btn sm" onclick="tab('quiz')">Take a quiz</button> <button class="btn sm ghost" onclick="tab('mentor')">Ask the mentor</button></div></div>
<div class="card" style="margin-top:14px"><h2>Run the demo scenario</h2><small>Fails a JavaScript quiz on purpose and shows the adaptive roadmap. Click again to switch the goal to Data Scientist.</small><br><br><button class="btn" onclick="demo()">Run demo scenario</button> <button class="btn ghost" onclick="S=fresh();save();render()">Reset data</button></div>`},
road(){const ph=road();return`<h1>Roadmap</h1><p class="sub">${S.role} · ${pct()}% complete</p>${ph.map(p=>`<div class="card" style="margin-bottom:14px"><h2>${p.t}</h2>${p.m.map(m=>`<div class="mod ${m.d?"d":""}"><div class="row sb"><h3>${m.topic}</h3>${m.d?'<span class="pill ok">Completed</span>':`<button class="btn sm" onclick="done('${m.s}','${m.k}')">${m.k=="rem"?"Mark reviewed":"Mark complete"}</button>`}</div><small>${m.h}h${m.k=="rem"?" · added by the adaptive engine":""}</small>${(EX[m.s]||m.ex)?`<div><small>Exercise: ${EX[m.s]||m.ex}</small></div>`:""}${RES[m.s]?`<div><small>Resource: <a href="${RES[m.s][1]}" target="_blank" rel="noopener">${RES[m.s][0]}</a></small></div>`:""}${Q[m.s]?`<div><small><a href="#" onclick="S.quiz='${m.s}';S.res=null;tab('quiz');return false">Take the ${m.s} quiz</a></small></div>`:""}</div>`).join("")}</div>`).join("")}`},
skills(){const g=gap();return`<h1>Skills</h1><p class="sub">Self-reported skills stay unverified until you pass a quiz.</p><div class="grid"><div class="card"><h2>Skill radar</h2>${radar()}<small>Solid: your level. Dashed: required level.</small></div>
<div class="card"><h2>How the score is calculated</h2><small>Readiness = 100 × Σ(weight × coverage × verification) ÷ Σ(weight). Coverage is your level divided by the required level, capped at 1. Verification is 1.0 after passing a quiz and 0.8 if self-reported.</small><div class="big">${g.sc}%</div><small>Gap: ${Math.round(1000-g.sc*10)/10}%</small></div></div>
<div class="card" style="margin-top:14px"><h2>Required vs your level</h2>${g.rows.map(x=>`<div class="mod row sb"><span><b>${x.s}</b> <small>needs ${LV[x.r]}</small></span><span><span class="pill">${LV[x.l]}</span><span class="pill ${x.v?"ok":"warn"}">${x.v?"Verified":x.l?"Unverified":"Missing"}</span><small>${Math.round(x.pts*10)/10}/${x.w} pts</small></span></div>`).join("")}</div>`},
quiz(){const q=S.quiz,names=Object.keys(Q);if(!q)return`<h1>Assessments</h1><p class="sub">Instant scoring with explanations. Results update your skill level and roadmap.</p><div class="grid">${names.map(n=>`<div class="card"><h2>${n}</h2><small>3 questions</small><br><br><button class="btn sm" onclick="S.quiz='${n}';S.res=null;render()">Start</button></div>`).join("")}</div>`;
if(S.res)return`<h1>${q} result: ${S.res.sc}%</h1><div class="note"><b>Mentor:</b> ${S.res.note}${trace()}</div>${S.res.fb.map(f=>`<div class="card" style="margin-bottom:10px"><span class="pill ${f.ok?"ok":"bad"}">${f.ok?"Correct":"Incorrect"}</span> <b>${f.q}</b><br><small>Answer: ${f.a}. ${f.w}</small></div>`).join("")}<button class="btn" onclick="S.quiz=null;render()">Back to assessments</button> <button class="btn ghost" onclick="tab('road')">View roadmap</button>`;
return`<h1>${q} quiz</h1><p class="sub">Answer all questions, then submit.</p>${S.err?`<div class="note" role="alert">${S.err}</div>`:""}${Q[q].map((x,i)=>`<div class="card q"><b>${x[0]}</b>${x[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o.replace(/</g,"&lt;")}</label>`).join("")}</div>`).join("")}<button class="btn" onclick="submit()">Submit answers</button> <button class="btn ghost" onclick="S.quiz=null;S.err='';render()">Cancel</button>`},
mentor(){return`<h1>AI mentor</h1><p class="sub">Answers use your skills, roadmap and progress. Mode: Demo (rule-based, runs in your browser).</p><div class="card"><div class="chat">${S.chat.map(m=>`<div class="b ${m.r}">${m.t}</div>`).join("")||"<small>Pick a question below or type your own.</small>"}</div><div style="margin:12px 0">${["What should I learn today?","What skills am I missing?","Why is my assessment score low?","Give me a JavaScript practice exercise","Suggest a project","How much of my roadmap is completed?"].map(x=>`<button class="pill" style="border:0;cursor:pointer" onclick="send('${x}')">${x}</button>`).join("")}</div><div class="row"><input id="ci" type="text" placeholder="Ask your mentor" aria-label="Message" onkeydown="if(event.key=='Enter')send()" style="flex:1"><button class="btn" onclick="send()">Send</button></div></div>`},
careers(){return`<h1>Careers</h1><p class="sub">Compare your readiness across roles. Switching goals keeps completed skills.</p><div class="grid">${Object.keys(R).map(r=>{const g=gap(r);return`<div class="card"><h2>${r}</h2><div class="bar"><i style="width:${g.sc}%"></i></div><small>Readiness ${g.sc}% · missing ${g.miss.length}, below level ${g.part.length}</small><br><br>${r==S.role?'<span class="pill ok">Current goal</span>':`<button class="btn sm" onclick="goal('${r}')">Set as goal</button>`}</div>`}).join("")}</div>`}};
const TABS=[["dash","Dashboard"],["road","Roadmap"],["skills","Skills"],["quiz","Assessments"],["mentor","AI mentor"],["careers","Careers"]];
function tab(t){S.tab=t;if(t!="quiz")S.quiz=null;save();render();scrollTo(0,0)}
function render(){$("#nav").innerHTML='<div class="brand">SkillPath AI</div>'+TABS.map(([k,l])=>`<button class="${S.tab==k?"on":""}" onclick="tab('${k}')">${l}</button>`).join("")+'<div class="sp"></div><button onclick="theme()">Light / dark</button>';$("#main").innerHTML=V[S.tab]()}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"}
render();
</script></body></html>
